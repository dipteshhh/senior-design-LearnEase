name: Backend Contract CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "docs/**"
      - ".github/workflows/backend-contract-e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/**"
      - ".github/workflows/backend-contract-e2e.yml"

jobs:
  backend-quality:
    name: Backend lint, build, type-check, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm exec tsc --noEmit

      - name: Unit tests
        run: npm test

  backend-openai-integration:
    name: OpenAI integration tests (secret-gated)
    runs-on: ubuntu-latest
    needs: backend-quality
    defaults:
      run:
        working-directory: backend
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: OpenAI integration tests
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: RUN_INTEGRATION=true npm run test:integration

      - name: Skipped (no OPENAI_API_KEY secret)
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "::notice title=OpenAI integration skipped::OPENAI_API_KEY secret is not configured for this repository, so live OpenAI integration tests did not run."

  backend-contract-e2e:
    name: Contract E2E smoke (secret-gated, isolated temp storage)
    runs-on: ubuntu-latest
    needs: backend-quality
    defaults:
      run:
        working-directory: backend
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_TEST_ID_TOKEN: ${{ secrets.GOOGLE_TEST_ID_TOKEN }}
      FILE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      SESSION_SECRET: ci-session-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # scripts/e2e-test.sh creates its own mktemp DATABASE_PATH/ARTIFACTS_DIR
      # and removes them on exit, so this job never touches a shared data store.
      - name: Contract E2E smoke
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: bash scripts/e2e-test.sh

      - name: Skipped (no OPENAI_API_KEY secret)
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "::notice title=Backend E2E skipped::OPENAI_API_KEY secret is not configured for this repository, so the contract E2E smoke did not run."
